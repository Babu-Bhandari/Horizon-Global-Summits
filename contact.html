<!doctype html>
<html lang="en">
  <head>
    <script>try{if(localStorage.getItem('hohorizon-theme')==='light')document.documentElement.dataset.theme='light';}catch(e){}</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — HOHORIZON GLOBAL AFFAIRS</title>
    <meta name="description" content="Contact HOHORIZON GLOBAL AFFAIRS. The public email address will be added when it is confirmed." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="contact" data-email="" data-ga="">
    <a class="skip" href="#content">Skip to content</a>
    <header id="site-header"></header>
    <main id="content">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Contact</p>
          <h1>Write to the forum.</h1>
          <p>Email address to be confirmed. There is no public telephone number on this site yet.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap">
          <form class="site-form" data-kind="contact">
            <label>Name<input name="name" required autocomplete="name" /></label>
            <label>Email<input name="email" type="email" required autocomplete="email" /></label>
            <label>Message<textarea name="message" rows="5" required></textarea></label>
            <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off" /></label>
            <button class="btn" type="submit">Send</button>
            <p class="form-error" hidden></p>
          </form>
          <div class="thanks" hidden><p></p></div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
