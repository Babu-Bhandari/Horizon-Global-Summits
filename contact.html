<!doctype html>
<html lang="en">
  <head>
    <script>try{if(localStorage.getItem('hohorizon-theme')==='light')document.documentElement.dataset.theme='light';}catch(e){}</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Horizon Global Summits</title>
    <meta name="description" content="Contact Horizon Global Summits at connect@horizonglobalsummits.com." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="contact" data-email="connect@horizonglobalsummits.com" data-ga="">
    <a class="skip" href="#content">Skip to content</a>
    <header id="site-header"></header>
    <main id="content">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Contact</p>
          <h1>Write to the forum.</h1>
          <p>Write to connect@horizonglobalsummits.com. There is no public telephone number on this site yet.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap">
          <form class="site-form contact-form" data-kind="contact">
            <div class="form-grid">
              <label>Name<input name="name" required autocomplete="name" /></label>
              <label>Work email<input name="email" type="email" required autocomplete="email" /></label>
              <label>Company<input name="organisation" required autocomplete="organization" /></label>
              <label>Job title<input name="role" required autocomplete="organization-title" /></label>
              <label>Phone (optional)<input name="phone" type="tel" autocomplete="tel" /></label>
              <label>Country
                <select name="country" required data-countries autocomplete="country-name">
                  <option value="">Select</option>
                </select>
              </label>
              <label class="is-wide">How can we help
                <select name="enquiry" required>
                  <option value="">Select</option>
                  <option>Request an invitation</option>
                  <option>Become a partner</option>
                  <option>Speaking opportunity</option>
                  <option>Sponsorship</option>
                  <option>Media enquiry</option>
                  <option>General question</option>
                </select>
              </label>
              <label class="is-wide">Message<textarea name="message" rows="5" required></textarea></label>
            </div>
            <label class="hp" aria-hidden="true">Leave this empty<input type="text" name="hz_trap" value="" tabindex="-1" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" /></label>
            <button class="btn" type="submit">Send message</button>
            <p class="form-error" hidden></p>
          </form>
          <div class="thanks" hidden><p></p></div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
