<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request an Invitation — HOHORIZON GLOBAL AFFAIRS</title>
    <meta name="description" content="Request an invitation to HOHORIZON GLOBAL AFFAIRS. A request is not a confirmed place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="invitation" data-email="" data-ga="">
    <a class="skip" href="#content">Skip to content</a>
    <header id="site-header"></header>
    <main id="content">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Invitation</p>
          <h1>Ask for a place. It is reviewed.</h1>
          <p>Sending this form does not reserve a seat. An invitation is issued only when a gathering has a date and a place for you.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap">
          <form class="site-form" data-kind="invitation">
            <label>Name<input name="name" required autocomplete="name" /></label>
            <label>Organisation<input name="organisation" required /></label>
            <label>Role<input name="role" required /></label>
            <label>Country<input name="country" required autocomplete="country-name" /></label>
            <label>Email<input name="email" type="email" required autocomplete="email" /></label>
            <label>Why this forum<textarea name="message" rows="5" required></textarea></label>
            <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off" /></label>
            <button class="btn" type="submit">Request an invitation</button>
            <p class="form-error" hidden></p>
          </form>
          <div class="thanks" hidden><p></p></div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
